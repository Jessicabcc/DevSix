<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - UniSapiens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark">
    <div class="auth-container">
        <div class="auth-card glass-effect">
            <div class="auth-header">
                <h2>Registro de {{ tipo_conta }}</h2>
                <p>Complete seu cadastro na plataforma</p>
            </div>

            <form action="{{ url_for('registro') }}" method="POST">
                <input type="hidden" name="token" value="{{ token }}">

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <div class="input-wrapper">
                        <input type="text" id="nome" name="nome" placeholder="Ex: Prof. João" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-mail institucional</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="nome@instituicao.edu.br" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">Finalizar Cadastro</button>
            </form>

            <div class="auth-footer">
                <p>Já possui cadastro? <a href="{{ url_for('login') }}">Faça Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
